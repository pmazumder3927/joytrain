title: "Block 1 W2D1 — Pause Squat + Lower"
folder: "Block 1 — Restart"
notes: |
  BLOCK 1 / WEEK 2 / DAY 1.

  W2 progression: +5% on the main lift top set vs W1, RPE 7.5.
  See `2026-05-11_block1-w1d1-squat.yaml` (W1D1) for full cues.

  Adjust loads up if W1 actuals were lighter than RPE 7.5 — these
  prescriptions assume W1 top set @ 145 lb hit RPE 7.5 cleanly.

  CUES (abbreviated):
    - Pause Squat: 1s bottom pause every rep.
    - Hip Thrust: 1s top pause, ribs down.
    - Front-rack walking lunge: DBs at shoulders.
    - SLRDL: contralateral DB, hinge.

exercises:
  - exercise: "Stretching"
    rest_seconds: 0
    notes: "WARMUP 1/5 — row 500m / jump rope 4-5 min / easy jog."
    sets:
      - { duration_seconds: 300, type: warmup }
  - exercise: "Reverse Lunge (Dumbbell)"
    rest_seconds: 30
    notes: "WARMUP 2/5 — goblet, 10 each leg."
    sets:
      - { reps: 20, weight_lb: 25, type: warmup }
  - exercise: "Chest Supported Y Raise (Dumbbell)"
    rest_seconds: 30
    notes: "WARMUP 3/5 — 1×15, very light."
    sets:
      - { reps: 15, weight_lb: 5, type: warmup }
  - exercise: "Box Jump"
    rest_seconds: 45
    notes: "WARMUP 4/5 — 1×5."
    sets:
      - { reps: 5, type: warmup }
  - exercise: "ac957bda-e1fb-4d7c-958c-0ff0e4fe6a66"  # Banded Plank Walkout
    rest_seconds: 30
    notes: "WARMUP 5/5 — 8 walkouts. Demo: https://www.youtube.com/watch?v=oB-8RZBZQG8"
    sets:
      - { reps: 8, type: warmup }

  - exercise: "Pause Squat (Barbell)"
    rest_seconds: 180
    notes: "ANCHOR. 1s pause at bottom. +5% over W1. Top set RPE 7.5."
    sets:
      - { reps: 5, weight_lb: 45, type: warmup }
      - { reps: 5, weight_lb: 95, type: warmup }
      - { reps: 3, weight_lb: 125, type: warmup }
      - { reps: 8, weight_lb: 135, rpe: 7 }
      - { reps: 8, weight_lb: 145, rpe: 7.5 }
      - { reps: 8, weight_lb: 155, rpe: 7.5 }

  - exercise: "Hip Thrust (Barbell)"
    rest_seconds: 120
    notes: "Block 9 W1D2 slot. 3×12, RPE 7. +10 lb over W1."
    sets:
      - { count: 3, reps: 12, weight_lb: 165, rpe: 7 }

  - exercise: "17c4f4ad-c0ae-4729-a34b-d450380ad250"  # Front Rack Walking Lunge
    rest_seconds: 90
    notes: "Front rack DBs at shoulders. 12 reps/set (6 each leg). Demo: https://www.youtube.com/watch?v=wpYr3tVus3Q"
    sets:
      - { count: 3, reps: 12, weight_lb: 30 }

  - superset: A
    exercise: "Single Leg Romanian Deadlift (Dumbbell)"
    rest_seconds: 60
    notes: "Block 9 spec 5,5,5,5,10 per leg. Last set burnout."
    sets:
      - { count: 4, reps: 5, weight_lb: 35 }
      - { reps: 10, weight_lb: 25 }
  - superset: A
    exercise: "Lateral Lunge"
    rest_seconds: 60
    notes: "4×5 each side. Goblet DB if RPE < 6."
    sets:
      - { count: 4, reps: 5, weight_lb: 25 }

  - exercise: "Plank"
    rest_seconds: 60
    notes: "3×1:20. Weighted on set 3 if easy."
    sets:
      - { count: 3, duration_seconds: 80 }

  - superset: B
    exercise: "397dd589-27a2-47d1-a864-f6a9a98f0b0c"  # Copenhagen Plank
    rest_seconds: 45
    notes: "Adductor + anti-rotation hold. 25s each side. Demo: https://www.youtube.com/watch?v=tj8trAmxLe0"
    sets:
      - { count: 3, duration_seconds: 25 }

  - superset: B
    exercise: "Sit Up (Weighted)"
    rest_seconds: 45
    notes: "Core circuit 1/3."
    sets:
      - { count: 3, reps: 20, weight_lb: 25 }
  - superset: B
    exercise: "Hanging Knee Raise"
    rest_seconds: 45
    notes: "Core circuit 2/3."
    sets:
      - { count: 3, reps: 10 }
  - superset: B
    exercise: "Russian Twist (Weighted)"
    rest_seconds: 45
    notes: "Core circuit 3/3. Both sides = 1 rep."
    sets:
      - { count: 3, reps: 20, weight_lb: 25 }
