title: "Block 1 W4D4 — Bench Deload"
folder: "Block 1 — Restart"
notes: |
  Week 4 — Day 4. Deload + block close.

  Last session of the block. Bench deload + a couple of accessories.
  After this, message me with: top sets actually hit each lift, any
  cranky joints, and how you felt at the end of W3 — that's the
  feedback that calibrates the next block.

