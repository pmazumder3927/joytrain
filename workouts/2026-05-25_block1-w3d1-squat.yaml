title: "Block 1 W3D1 — Pause Squat + Lower"
folder: "Block 1 — Restart"
notes: |
  BLOCK 1 / WEEK 3 / DAY 1.

  W3 progression: heaviest week. Pause Squat moves from 3×8 to 4×6 to
  accommodate the load increase. Target RPE 8 (2 RIR) on top sets.
  See W1D1 (`2026-05-11_block1-w1d1-squat.yaml`) for full cues.

  THIS IS THE PUSH WEEK. Next week is deload. Don't grind — RPE 8
  means 2 left in the tank, not failure.

exercises:
  - exercise: "Stretching"
    rest_seconds: 0
    notes: "WARMUP 1/5."
    sets:
      - { duration_seconds: 300, type: warmup }
  - exercise: "Reverse Lunge (Dumbbell)"
    rest_seconds: 30
    notes: "WARMUP 2/5 — goblet."
    sets:
      - { reps: 20, weight_lb: 25, type: warmup }
  - exercise: "Chest Supported Y Raise (Dumbbell)"
    rest_seconds: 30
    notes: "WARMUP 3/5."
    sets:
      - { reps: 15, weight_lb: 5, type: warmup }
  - exercise: "Box Jump"
    rest_seconds: 45
    notes: "WARMUP 4/5."
    sets:
      - { reps: 5, type: warmup }
  - exercise: "ac957bda-e1fb-4d7c-958c-0ff0e4fe6a66"  # Banded Plank Walkout
    rest_seconds: 30
    notes: "WARMUP 5/5."
    sets:
      - { reps: 8, type: warmup }

  - exercise: "Pause Squat (Barbell)"
    rest_seconds: 210
    notes: "ANCHOR. Move to 4×6 for the heavier week. Top set 165 @ RPE 8."
