  - exercise: "Plank"
    rest_seconds: 60
    notes: "3×1:30 (up from 1:20). Weight on set 3 if easy."
    sets:
      - { count: 3, duration_seconds: 90 }

  - superset: B
    exercise: "Sit Up (Weighted)"
    rest_seconds: 45
    notes: "Core 1/3."
    sets:
      - { count: 3, reps: 20, weight_lb: 30 }
  - superset: B
