      - { reps: 5, weight_lb: 95, type: warmup }
      - { reps: 3, weight_lb: 125, type: warmup }
      - { reps: 3, weight_lb: 145, type: warmup }
      - { reps: 6, weight_lb: 155, rpe: 7.5 }
      - { reps: 6, weight_lb: 160, rpe: 8 }
      - { reps: 6, weight_lb: 165, rpe: 8 }
      - { reps: 6, weight_lb: 165, rpe: 8 }

  - exercise: "Hip Thrust (Barbell)"
    rest_seconds: 120
    notes: "3×10 (drop from 12 reps as load goes up). +10 lb over W2."
    sets:
