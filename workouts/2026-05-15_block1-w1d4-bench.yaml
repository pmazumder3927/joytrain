title: "Block 1 W1D4 — Bench + Upper Accessories + Arms"
folder: "Block 1 — Restart"
notes: |
  Week 1 — Day 4. Bench focus.

  Week 1 intent: anchor a bench top set at RPE 7 (conservative). Pause
  squat appears here as SECONDARY volume — keep it well under D1 loads.

  Cues:
    - Bench: feet planted, slight arch, scaps retracted. Pause briefly
      on the chest, no bouncing. Bar path slightly back to the rack.
    - External rotation: elbow pinned to side, slow controlled
      external rotation. Light weight — feel the rear cuff.
    - Pause Squat (secondary): same cues as D1, but lighter. This is
      pump volume, not strength.
    - Alternating DB Bench: one arm presses while the other holds in
      the bottom position. Slow, controlled, anti-rotate.
    - Suitcase Deadlift: one KB at one side. STAY VERTICAL — don't
      lean toward the weight. Core fights the lateral pull.
    - Arm circuit: heavy. 3-second eccentrics on the curls, control
      on the skullcrushers.

exercises:
  # ----- WARMUP -----

  - exercise: "Stretching"
    rest_seconds: 0
    notes: "WARMUP 1/5 — row 500m OR jump rope 4-5 min."
    sets:
      - { duration_seconds: 300, type: warmup }

  - exercise: "Reverse Lunge (Dumbbell)"
    rest_seconds: 30
    notes: "WARMUP 2/5 — goblet style, 10 each leg, light."
    sets:
      - { reps: 20, weight_lb: 25, type: warmup }

  - exercise: "Chest Supported Y Raise (Dumbbell)"
    rest_seconds: 30
    notes: "WARMUP 3/5 — shoulder prehab. 1×15, very light."
    sets:
      - { reps: 15, weight_lb: 5, type: warmup }

  - exercise: "Box Jump"
    rest_seconds: 45
    notes: "WARMUP 4/5 — CNS primer. 1×5, soft land."
    sets:
      - { reps: 5, type: warmup }

  - exercise: "ac957bda-e1fb-4d7c-958c-0ff0e4fe6a66"  # Banded Plank Walkout
    rest_seconds: 30
    notes: "WARMUP 5/5 — bracing primer. 8 walkouts. Demo: https://www.youtube.com/watch?v=oB-8RZBZQG8."
    sets:
      - { reps: 8, type: warmup }

  # ----- MAIN WORK -----

  - exercise: "Bench Press (Barbell)"
    rest_seconds: 180
    notes: |
      ANCHOR LIFT. 4×6.
      W1 calibration: ramping warmup, then 4 working sets of 6 at
      RPE 7. Top set 135 lb. If it's RPE < 6, bump to 145 next set.
    sets:
      - { reps: 5, weight_lb: 45, type: warmup }
      - { reps: 5, weight_lb: 95, type: warmup }
      - { reps: 3, weight_lb: 115, type: warmup }
      - { reps: 6, weight_lb: 115, rpe: 7 }
      - { reps: 6, weight_lb: 125, rpe: 7 }
      - { reps: 6, weight_lb: 135, rpe: 7 }
      - { reps: 6, weight_lb: 135, rpe: 7.5 }

  - exercise: "32d79e65-eb2a-4ae9-8561-f81a3c71bbad"  # Chest Supported External Rotation
    rest_seconds: 60
    notes: |
      4×10. Lay face-down on an incline bench. Light
      DBs (5-10 lb). Elbow pinned at 90°, externally rotate the DB up.
      This is PREHAB. Don't ego-load.
      Demo: https://www.youtube.com/watch?v=2Ryroega_wk
    sets:
      - { count: 4, reps: 10, weight_lb: 8 }

  - exercise: "Pause Squat (Barbell)"
    rest_seconds: 150
    notes: |
      SECONDARY MOVEMENT. 5×3 @ 145 lb, still safely below D1 anchor
      (W1 D1 top set = 145 @ 8 reps).
      1s pause at bottom every rep.
    sets:
      - { count: 5, reps: 3, weight_lb: 145, rpe: 6 }

  - exercise: "Bench Press (Dumbbell)"
    rest_seconds: 90
    notes: |
      Alternating DB Bench Press — 8,8,8,12 @ final set MAX.
      Alternating means: press right, hold left at bottom; press left,
      hold right at bottom. 8 reps EACH arm = 16 total per set. Last
      set is rep MAX.
      Demo: https://www.youtube.com/watch?v=xPR-LN2ppx0
    sets:
      - { reps: 16, weight_lb: 35 }
      - { reps: 16, weight_lb: 35 }
      - { reps: 16, weight_lb: 35 }
      - { reps: 24, weight_lb: 30, type: failure }

  - exercise: "45e60221-6618-4055-9f14-9611e353df79"  # Suitcase Deadlift
    rest_seconds: 75
    notes: |
      KB Suitcase Deadlift — 3×12 each side. One heavy KB at one side.
      Deadlift it. STAY VERTICAL — that's the whole point. 32kg KB,
      sized for anti-lateral-flexion stimulus.
      Demo: https://www.youtube.com/watch?v=dj3lWcYMZQg
    sets:
      - { count: 3, reps: 24, weight_lb: 71 }

  # ----- ARM CIRCUIT -----

  - superset: A
    exercise: "Bicep Curl (Barbell)"
    rest_seconds: 60
    notes: |
      Barbell Bicep Curls — 3×8. Strict, no swing, 3-sec eccentric.
      Heavy enough that 8 is hard.
    sets:
      - { count: 3, reps: 8, weight_lb: 65 }

  - superset: A
    exercise: "Skullcrusher (Barbell)"
    rest_seconds: 60
    notes: |
      Barbell Skull Crushers — 3×8. EZ bar if available. Lower to
      forehead, control. Don't flare elbows.
    sets:
      - { count: 3, reps: 8, weight_lb: 55 }

  - superset: A
    exercise: "Chest Fly (Dumbbell)"
    rest_seconds: 60
    notes: |
      DB Chest Fly — 3×8. Slight elbow bend, control. Don't let DBs
      drift below shoulder line at bottom.
    sets:
      - { count: 3, reps: 8, weight_lb: 30 }
