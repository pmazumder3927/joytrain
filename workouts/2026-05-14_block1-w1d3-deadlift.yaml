title: "Block 1 W1D3 — Deadlift + Posterior + Power"
folder: "Block 1 — Restart"
notes: |
  Week 1 — Day 3, deadlift + posterior chain + full-body power.

  Anchor = Deadlift ramping 5,5,5,3,3,3. Top single 235 lb @ RPE 7.5
  (conservative seed assuming ~315 lb 1RM — recalibrate after today).

  THEMES: hinge volume, single-leg posterior chain, athletic power
  (slams), loaded carries. Keep the slam/carry primal feel.

  CUES:
    - Deadlift: brace BEFORE pulling slack. Wedge into the bar. Hips
      and shoulders rise together off the floor — no goodmornings.
      Reset between every rep (no touch-and-go on the heavier sets).
    - Hollow Body Hold: lower back PRESSED into floor. If it lifts,
      bend the knees more or shorten the lever.
    - Rear-foot elevated split squat: front shin vertical, slow down,
      drive through the front heel. 6 reps EACH leg.
    - Toe-elevated DB RDL: stand on a plate (toes on, heels off). This
      shifts load to the hamstrings/glutes. Hinge, don't squat.
    - 1-arm DB push press: dip-drive-press. Use leg drive — that's
      what makes this a "push" press, not a strict press. Switch arms.
    - Farmer carry: chest up, ribs down, breathe. 100 ft per set.
    - Ball slams: throw it at the ground like you mean it. Bend knees
      to catch the bounce, repeat. 5 reps explosive.

exercises:
  # ----- WARMUP -----

  - exercise: "Stretching"
    rest_seconds: 0
    notes: |
      WARMUP 1/5 — row 500m OR jump rope 4-5 min. Get warm + a little
      sweaty before loading the bar.
    sets:
      - { duration_seconds: 300, type: warmup }

  - exercise: "Reverse Lunge (Dumbbell)"
    rest_seconds: 30
    notes: |
      WARMUP 2/5 — goblet style, 10 each leg. Light DB (20-25 lb).
    sets:
      - { reps: 20, weight_lb: 25, type: warmup }

  - exercise: "Chest Supported Y Raise (Dumbbell)"
    rest_seconds: 30
    notes: |
      WARMUP 3/5 — shoulder prehab. Light. 1×15. Squeeze lower traps.
    sets:
      - { reps: 15, weight_lb: 5, type: warmup }

  - exercise: "Box Jump"
    rest_seconds: 45
    notes: |
      WARMUP 4/5 — CNS primer. Low-moderate box. Soft land, stand up,
      step down. 1×5.
    sets:
      - { reps: 5, type: warmup }

  - exercise: "ac957bda-e1fb-4d7c-958c-0ff0e4fe6a66"  # Banded Plank Walkout
    rest_seconds: 30
    notes: |
      WARMUP 5/5 — bracing primer. 8 walkouts. Light band at the wrists.
      Demo: https://www.youtube.com/watch?v=oB-8RZBZQG8
    sets:
      - { reps: 8, type: warmup }

  # ----- MAIN WORK -----

  - exercise: "Deadlift (Barbell)"
    rest_seconds: 240
    notes: |
      ANCHOR LIFT. 5,5,5,3,3,3 @ 65/68/70/72/75/78%.
      6 working sets ascending. Top set 225 lb @ RPE 7 (conservative
      seed assuming ~315 lb 1RM — recalibrate after today).
      Reset between every rep on the heavier triples.
    sets:
      - { reps: 5, weight_lb: 135, type: warmup }
      - { reps: 5, weight_lb: 165, type: warmup }
      - { reps: 5, weight_lb: 185, rpe: 7 }
      - { reps: 5, weight_lb: 195, rpe: 7 }
      - { reps: 5, weight_lb: 205, rpe: 7 }
      - { reps: 3, weight_lb: 215, rpe: 7 }
      - { reps: 3, weight_lb: 225, rpe: 7 }
      - { reps: 3, weight_lb: 235, rpe: 7.5 }

  - exercise: "8c2bbcb2-cf0f-4029-aa77-c294f6e7a693"  # Hollow Body Hold
    rest_seconds: 60
    notes: |
      4×45 sec. Anti-extension core. Low back glued
      to floor — if it lifts, bend knees to shorten lever.
      Demo: https://www.youtube.com/watch?v=JnuYfsJ3CKg
    sets:
      - { count: 4, duration_seconds: 45 }

  - superset: A
    exercise: "Bulgarian Split Squat"
    rest_seconds: 75
    notes: |
      DB Rear Foot Elevated Split Squat — 3×6".
      Hold a DB in each hand (25 lb). 6 EACH leg. Front shin vertical.
    sets:
      - { count: 3, reps: 6, weight_lb: 25 }

  - superset: A
    exercise: "Romanian Deadlift (Dumbbell)"
    rest_seconds: 75
    notes: |
      Toe Elevated DB RDL — 3×6". Stand with toes on
      a plate (heels lower). Hinge from hips. Slow eccentric, hamstrings
      should scream.
      Demo: https://www.youtube.com/watch?v=4-l6t_ziW8I
    sets:
      - { count: 3, reps: 6, weight_lb: 45 }

  - exercise: "c78158b0-3082-48b4-99e0-20d24fbe2d9f"  # Single Arm DB Push Press (custom)
    rest_seconds: 90
    notes: |
      1 Arm DB Push Press — 3×5". Use ONE dumbbell
      held at the shoulder. Dip-drive-press, alternating arms. 5 reps
      EACH arm. Anti-rotation core demand makes this a different
      stimulus than bilateral barbell push press.
      Demo: https://www.youtube.com/watch?v=ycv3PI0YVsg
    sets:
      - { count: 3, reps: 5, weight_lb: 35 }

  - exercise: "Farmers Walk"
    rest_seconds: 120
    notes: |
      Trap Bar Farmer Carry — 3×100 ft". Use a trap
      bar loaded heavy (~155-185 lb total). If no trap bar, heavy DBs
      in each hand. Logged as distance (~30m = 100 ft).
    sets:
      - { count: 3, distance_meters: 30, weight_lb: 155 }

  - exercise: "Ball Slams"
    rest_seconds: 60
    notes: |
      Med Ball Slam — 4×5". Explosive. Throw it
      DOWN. Catch the bounce, reset, repeat. 4×5.
    sets:
      - { count: 4, reps: 5 }

  - superset: B
    exercise: "fafd204e-ed13-4ec5-a764-43e8743d3935"  # Single Leg Banded Hamstring Curl
    rest_seconds: 45
    notes: |
      Single Leg Banded Hamstring Curl — 2×20".
      Anchor a band low (or use rack base). Lie face down, loop around
      one ankle, curl the heel to the glute. 20 reps EACH leg.
      Demo: https://www.youtube.com/watch?v=riYiKc0_0Fs
    sets:
      - { count: 2, reps: 20 }

  - superset: B
    exercise: "Leg Extension (Machine)"
    rest_seconds: 45
    notes: |
      Kneeling Leg Extension — 2×20". Use the
      machine seated — squeeze quads HARD at the top, slow eccentric.
      2×20, moderate weight.
    sets:
      - { count: 2, reps: 20, weight_lb: 70 }
